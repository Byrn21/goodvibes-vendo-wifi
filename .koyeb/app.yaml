name: goodvibes-vendo-wifi
description: Omada captive portal backend with voucher authentication

services:
  - name: backend
    type: web
    build:
      type: buildpack
      context: backend
      buildCommand: npm install --production
    run:
      command: npm start
      workingDirectory: backend
    ports:
      - port: 8080
        protocol: http
    env:
      - name: NODE_ENV
        value: production
      - name: PORT
        value: "8080"
      - name: DATABASE_URL
        value: sqlite:./data/portal.db
      - name: DEFAULT_SESSION_DURATION
        value: "60"
      - name: PAUSE_ENABLED
        value: "true"
      - name: SESSION_ENFORCE_INTERVAL
        value: "60000"
      - name: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - name: RATE_LIMIT_MAX_REQUESTS
        value: "20"
      - name: LOG_LEVEL
        value: info
      - name: DEFAULT_REDIRECT_URL
        value: https://www.google.com
      # Secrets - set these in Koyeb dashboard
      # - BASE_URL (e.g., https://goodvibes-vendo-wifi-[org].koyeb.app)
      # - FRONTEND_ORIGIN (your frontend URL)
      # - OMADA_BASE_URL
      # - OMADA_API_TOKEN
      # - OMADA_SITE
      # - JWT_SECRET
      # - CORS_ORIGINS
    volumes:
      - name: portal-data
        path: /workspace/backend/data
        size: 1
    regions:
      - fra  # Change to your preferred region (sin for Singapore, sfo for US West, etc.)
    instance:
      type: free  # Free tier: 512 MB RAM, 2 vCPU
    scaling:
      min: 1
      max: 1
    healthChecks:
      - type: http
        path: /api/health
        port: 8080
        interval: 30
        timeout: 10
        gracePeriod: 60
