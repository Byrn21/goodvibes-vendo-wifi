# Fly.io app configuration for GoodVibesVendoWifi backend
app = "goodvibesvendowifi-backend"
primary_region = "manila"

[build]

[deploy]
  release_command = ""

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[metrics]
  port = 9090
  path = "/metrics"
